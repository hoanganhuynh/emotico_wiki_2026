<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
  <title id="flow-title">Ba bước dùng một tính năng Emotico</title>
  <desc id="flow-desc">Người dùng bắt đầu bằng việc chọn tính năng, trả lời hoặc thực hiện hướng dẫn, sau đó xem gợi ý bước tiếp theo hoặc tìm hỗ trợ.</desc>
  <rect width="960" height="270" rx="28" fill="#F7F7F9"/>
  <g font-family="Arial, sans-serif" fill="#1A1A2E" text-anchor="middle">
    <circle cx="190" cy="120" r="62" fill="#FFB223" stroke="#1A1A2E" stroke-width="3"/><text x="190" y="113" font-size="18" font-weight="700">1. Chọn</text><text x="190" y="139" font-size="15">tính năng</text>
    <path d="M278 120h110" stroke="#1A1A2E" stroke-width="4"/><path d="m375 105 20 15-20 15" fill="none" stroke="#1A1A2E" stroke-width="4"/>
    <circle cx="480" cy="120" r="62" fill="#FFE5A8" stroke="#1A1A2E" stroke-width="3"/><text x="480" y="113" font-size="18" font-weight="700">2. Thực hiện</text><text x="480" y="139" font-size="15">theo hướng dẫn</text>
    <path d="M568 120h110" stroke="#1A1A2E" stroke-width="4"/><path d="m665 105 20 15-20 15" fill="none" stroke="#1A1A2E" stroke-width="4"/>
    <circle cx="770" cy="120" r="62" fill="#FFF9ED" stroke="#1A1A2E" stroke-width="3"/><text x="770" y="113" font-size="18" font-weight="700">3. Bước tiếp</text><text x="770" y="139" font-size="15">theo phù hợp</text>
    <text x="480" y="225" font-size="16" fill="#4B4B59">Bạn có thể dừng bất cứ lúc nào và tìm đến người lớn tin cậy khi cần hỗ trợ.</text>
  </g>
</svg>
