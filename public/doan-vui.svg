<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="fun-title" aria-describedby="fun-desc" lang="vi">
  <title id="fun-title">Minh họa Đoán vui</title><desc id="fun-desc">Các thẻ câu hỏi vui, biểu tượng ngôi sao và lựa chọn sở thích, minh họa một trải nghiệm khám phá nhẹ nhàng.</desc>
  <rect width="960" height="360" rx="28" fill="#F7F7F9"/>
  <text x="56" y="64" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A2E">Khám phá những góc nhỏ của bản thân</text>
  <text x="56" y="92" font-family="Arial, sans-serif" font-size="16" fill="#5E5E70">Một câu hỏi ngắn có thể gợi ra sở thích, thói quen và điều học sinh muốn kể.</text>
  <g transform="rotate(-8 290 215)"><rect x="144" y="137" width="280" height="166" rx="24" fill="#FFE5A8" stroke="#1A1A2E" stroke-width="3"/><text x="177" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9A5A00">CÂU HỎI HÔM NAY</text><text x="177" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">Điều gì làm em</text><text x="177" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">có thêm năng lượng?</text></g>
  <g transform="rotate(7 613 208)"><rect x="494" y="128" width="280" height="166" rx="24" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="3"/><path d="m700 158 8 16 18 3-13 13 3 18-16-9-16 9 3-18-13-13 18-3z" fill="#FFB223" stroke="#1A1A2E" stroke-width="2"/><text x="526" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1A2E">Chọn điều gần với em</text><rect x="526" y="226" width="90" height="34" rx="17" fill="#E8F4FF"/><text x="571" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">Âm nhạc</text><rect x="628" y="226" width="102" height="34" rx="17" fill="#E9F8EE"/><text x="679" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">Bạn bè</text></g>
  <text x="480" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5E5E70">Không cần câu trả lời đúng — chỉ cần một điểm bắt đầu để các em chia sẻ.</text>
</svg>
