<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="history-title" aria-describedby="history-desc" lang="vi">
  <title id="history-title">Minh họa Lịch sử cảm xúc</title><desc id="history-desc">Biểu đồ xu hướng với các lần check-in theo thời gian, giúp học sinh nhìn lại những ngày cần nhiều năng lượng hoặc nghỉ ngơi hơn.</desc>
  <rect width="960" height="360" rx="28" fill="#F7F7F9"/>
  <text x="56" y="64" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A2E">Nhìn lại theo từng khoảng thời gian</text>
  <text x="56" y="92" font-family="Arial, sans-serif" font-size="16" fill="#5E5E70">Các lần check-in tạo nên một bức tranh để học sinh tự suy ngẫm.</text>
  <rect x="56" y="126" width="848" height="178" rx="20" fill="#FFFFFF" stroke="#E0E0E6" stroke-width="2"/>
  <path d="M96 258H860M96 212H860M96 166H860" stroke="#E9E9EF" stroke-width="2"/>
  <path d="M112 236C164 222 184 182 234 194S314 252 370 222 456 152 512 176 582 235 642 204 728 150 842 174" fill="none" stroke="#FFB223" stroke-width="7" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#1A1A2E" stroke-width="3"><circle cx="112" cy="236" r="7"/><circle cx="234" cy="194" r="7"/><circle cx="370" cy="222" r="7"/><circle cx="512" cy="176" r="7"/><circle cx="642" cy="204" r="7"/><circle cx="842" cy="174" r="7"/></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#6B6B80"><text x="100" y="286">Thứ 2</text><text x="222" y="286">Thứ 3</text><text x="358" y="286">Thứ 4</text><text x="500" y="286">Thứ 5</text><text x="630" y="286">Thứ 6</text><text x="827" y="286">Cuối tuần</text></g>
  <rect x="675" y="142" width="190" height="42" rx="21" fill="#FFF1CC"/><text x="770" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A2E">Một tuần của em</text>
