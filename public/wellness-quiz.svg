<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="wellness-title" aria-describedby="wellness-desc" lang="vi">
  <title id="wellness-title">Minh họa Wellness Quiz</title><desc id="wellness-desc">Bốn mảng đời sống gồm nghỉ ngơi, học tập, mối quan hệ và đời sống số, dùng để gợi mở suy ngẫm về sức khỏe toàn diện.</desc>
  <rect width="960" height="360" rx="28" fill="#F7F7F9"/>
  <text x="56" y="64" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A2E">Khám phá những mảng trong đời sống</text>
  <text x="56" y="92" font-family="Arial, sans-serif" font-size="16" fill="#5E5E70">Mỗi chủ đề là một điểm chạm để học sinh nhìn lại nhịp sống của mình.</text>
  <g font-family="Arial, sans-serif" fill="#1A1A2E"><rect x="56" y="132" width="196" height="154" rx="24" fill="#E8F4FF"/><circle cx="96" cy="172" r="21" fill="#23AEFF"/><path d="M86 172h20M96 162v20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><text x="80" y="226" font-size="20" font-weight="700">Nghỉ ngơi</text><text x="80" y="252" font-size="14" fill="#4B4B59">Giấc ngủ &amp; hồi phục</text>
  <rect x="270" y="132" width="196" height="154" rx="24" fill="#FFF1CC"/><circle cx="310" cy="172" r="21" fill="#FFB223"/><path d="M300 179h20v-14h-20zM304 161h12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><text x="294" y="226" font-size="20" font-weight="700">Học tập</text><text x="294" y="252" font-size="14" fill="#4B4B59">Nhịp độ &amp; áp lực</text>
  <rect x="484" y="132" width="196" height="154" rx="24" fill="#F5EAFE"/><circle cx="524" cy="172" r="21" fill="#9D62D9"/><path d="M514 177c16-17 4-24 10-12 6-12-6-5 10 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><text x="508" y="226" font-size="20" font-weight="700">Mối quan hệ</text><text x="508" y="252" font-size="14" fill="#4B4B59">Bạn bè &amp; gia đình</text>
  <rect x="698" y="132" width="206" height="154" rx="24" fill="#E9F8EE"/><circle cx="738" cy="172" r="21" fill="#43B86B"/><rect x="728" y="159" width="20" height="27" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3"/><circle cx="738" cy="181" r="1.5" fill="#FFFFFF"/><text x="722" y="226" font-size="20" font-weight="700">Đời sống số</text><text x="722" y="252" font-size="14" fill="#4B4B59">Kết nối &amp; cân bằng</text></g>
</svg>
