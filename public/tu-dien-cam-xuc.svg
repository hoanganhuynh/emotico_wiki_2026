<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="dictionary-title" aria-describedby="dictionary-desc" lang="vi">
  <title id="dictionary-title">Minh họa Từ điển cảm xúc</title><desc id="dictionary-desc">Một thẻ định nghĩa cảm xúc với các từ liên quan, minh họa việc mở rộng vốn từ để gọi tên trải nghiệm.</desc>
  <rect width="960" height="360" rx="28" fill="#F7F7F9"/>
  <text x="56" y="64" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A2E">Gọi đúng tên điều đang diễn ra</text>
  <text x="56" y="92" font-family="Arial, sans-serif" font-size="16" fill="#5E5E70">Một từ phù hợp có thể mở đầu cho một cuộc trò chuyện tốt hơn.</text>
  <rect x="56" y="126" width="510" height="176" rx="24" fill="#FFFFFF" stroke="#E0E0E6" stroke-width="2"/>
  <rect x="84" y="152" width="76" height="76" rx="22" fill="#FFE5A8"/><path d="M106 187c10 12 28 12 38 0M108 172h2m20 0h2" fill="none" stroke="#1A1A2E" stroke-width="4" stroke-linecap="round"/>
  <text x="184" y="178" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A2E">Bối rối</text>
  <text x="184" y="207" font-family="Arial, sans-serif" font-size="16" fill="#4B4B59">Khi có nhiều điều xảy ra cùng lúc</text><text x="184" y="232" font-family="Arial, sans-serif" font-size="16" fill="#4B4B59">và chưa biết nên bắt đầu từ đâu.</text>
  <text x="84" y="273" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9A5A00">Ví dụ gần gũi</text><text x="205" y="273" font-family="Arial, sans-serif" font-size="14" fill="#5E5E70">“Em có nhiều bài cùng lúc nên hơi bối rối.”</text>
  <text x="640" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6B80">TỪ GẦN NGHĨA</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1A2E"><rect x="640" y="170" width="144" height="46" rx="23" fill="#FFF1CC"/><text x="712" y="200" text-anchor="middle">Lúng túng</text><rect x="640" y="228" width="150" height="46" rx="23" fill="#E8F4FF"/><text x="715" y="258" text-anchor="middle">Phân vân</text><rect x="800" y="199" width="116" height="46" rx="23" fill="#E9F8EE"/><text x="858" y="229" text-anchor="middle">Lo lắng</text></g>
</svg>
